notes=Novidade: Segure uma meta, uma categoria ou um orçamento (ou use o botão direito no PC) para as opções rápidas: editar, excluir e, nas metas, abrir e arquivar.\nMelhoria: "Comece por aqui" aparece só para quem está começando. Cada passo leva direto à ação, "Depois" o deixa para daqui a uma semana e "Ocultar" tira o card.\nMelhoria: Faturas do Início: a fatura paga aparece como "Paga", e com pagamento parcial o valor em destaque é o que falta pagar.\nCorreção: Sincronização: "Usar os dados da conta" não troca mais os dados do aparelho quando a conta ainda está vazia, e só fica disponível depois de conferir que a conta tem dados.\nCorreção: "Livre para gastar" não conta mais receitas de meses anteriores que não foram recebidas.
