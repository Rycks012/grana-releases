notes=Novidade: Início: "Livre para gastar", com quanto ainda dá para gastar até o fim do mês e por dia, e "Como calculamos" com a conta passo a passo.\nNovidade: Início: previsão de fechamento do mês, com o selo "no azul", "no limite" ou "no vermelho", e a comparação com os meses anteriores.\nNovidade: Início: o olho no cartão principal esconde os valores, para abrir o app em público.\nNovidade: Seção "Atenção agora": conta que vai ficar negativa, limite de gastos, fatura atrasada e mês anterior por fechar.\nNovidade: Seção "Próximos 7 dias": o que vence (e o que já venceu), por dia, com o botão de pagar.\nNovidade: Seção "Para onde foi o dinheiro": as categorias do mês, comparadas com um mês normal.\nNovidade: Seção "Dicas e descobertas", o resumo do mês que passou e, para quem está começando, o "Comece por aqui".\nNovidade: Anotações: escolha uma cor para cada anotação no botão da paleta; a cor aparece no cartão da lista e no fundo da anotação.\nMelhoria: Cartão principal: entrou, saiu, a receber e a pagar sempre à vista, e uma barra mostra quanto do mês já passou. Num mês que passou, o cartão traz o resumo dele.\nMelhoria: Orçamentos no Início avisam o dia em que devem acabar no ritmo atual; metas mostram se estão atrasadas ou concluídas.\nMelhoria: "Fechar o mês" aparece a partir do dia 25 (o cadeado do mês continua fechando em qualquer dia), e o Início avisa se o mês anterior ficou aberto.\nMelhoria: Relatórios: agora com as métricas do período (melhor e pior mês e médias por mês, dia e hora).\nRemovido: Aba Análises: tudo o que ela tinha está no Início.\nRemovido: Métricas no Início: foram para Relatórios.\nRemovido: "Mais detalhes" no cartão principal: os valores ficam sempre à vista.
