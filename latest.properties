# Versão mais nova do Grana. O app lê este arquivo quando o usuário toca em "Verificar atualização".
version=0.6.0
date=2026-11-03
notes=Em vez de vários avisos no mesmo horário, poucos resumos por dia: um de manhã, com o que vence e o que precisa de atenção, e um no fim do dia, com o que venceu e não foi pago.\nO resumo da manhã sai perto da hora em que você costuma abrir o Grana. Se não houver nada importante, ele não avisa, e nada sai entre 22h e 7h.\nContas grandes, como aluguel e fatura, são lembradas alguns dias antes; as outras, na véspera. Atrasadas voltam nos primeiros dias e depois uma vez por semana.\nNo domingo, o resumo da semana; no começo do mês, o resumo do mês que passou.\nOrçamento estourado avisa na hora; perto do limite, no resumo do fim do dia.\nNa tela de Notificações, você escolhe só os temas: contas e faturas, receitas, orçamentos, análises e fechamento do mês.\nTela nova Análises: o que pagar e receber nos próximos 7 dias, os destaques do momento e o resumo do mês que passou.\nDestaques no Início: as duas análises mais importantes de agora.\nPrevisão de como o mês termina no ritmo atual e comparação com o mesmo ponto dos meses anteriores.\nAviso de conta que vai ficar negativa nos próximos 30 dias com o que já está previsto.\nCategorias acima do normal, orçamento que vai estourar antes do fim do mês e sugestão de orçamento para quem gasta sempre na mesma categoria.\nCartões: fatura acima do normal, limite quase no fim, melhor dia para comprar e parcelas que já ocupam o mês que vem.\nAssinaturas e contas que se repetem sem estar lançadas como fixas, contas fixas que subiram de valor e gastos pequenos que somam muito.\nMetas atrasadas ou com valor a guardar no mês, e boas notícias, como meses seguidos no azul.\nTudo calculado no próprio aparelho, sem enviar nada. Nos três pontos de cada análise, diga o que é útil ou oculte um tipo.
