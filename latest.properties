notes=Novidade: Boas-vindas na primeira abertura: entre com seu e-mail ou use o Grana sem conta, só neste aparelho.\nNovidade: Minha conta: perfil, conta e sincronização, segurança e backup numa tela só, no menu do usuário.\nMelhoria: Entrar ficou mais simples: só o e-mail e o código. O servidor já vem preenchido (em "Avançado").\nMelhoria: Depois de entrar, os dados se resolvem sozinhos. Só quando a conta e o aparelho têm dados o app pergunta qual manter, mostrando o que há em cada um.\nRemovido: "Meu perfil", "Proteção e backup" e "Conta e sincronização" no menu do usuário: estão todos em Minha conta.
